<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqeedah Quiz - اختبار العقيدة الفخم</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #d4af37; /* ذهبي فخم */
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            --correct-color: #2ecc71;
            --wrong-color: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        #quiz-box {
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(44, 62, 80, 0.08);
            padding: 35px 25px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            border-top: 6px solid var(--accent-color);
            position: relative;
        }

        h1 {
            color: var(--primary-color);
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        #question-container {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 22px;
            border-radius: 18px;
            font-size: 18px;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(44, 62, 80, 0.15);
            min-height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #options-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .option-btn {
            background-color: #ffffff;
            color: #34495e;
            border: 2px solid #eef2f5;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: right;
            font-weight: 600;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 2px 5px rgba(0,0,0,0.01);
        }

        .option-btn:active {
            transform: scale(0.98);
        }

        .option-btn.correct {
            background-color: rgba(46, 204, 113, 0.15) !important;
            border-color: var(--correct-color) !important;
            color: #1e7e34 !important;
            font-weight: 700;
        }

        .option-btn.wrong {
            background-color: rgba(231, 76, 60, 0.15) !important;
            border-color: var(--wrong-color) !important;
            color: #bd2130 !important;
            font-weight: 700;
        }

        #progress {
            margin-top: 30px;
            color: #95a5a6;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            transform: translateY(-30px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .modal-title.success { color: var(--correct-color); }
        .modal-title.fail { color: var(--wrong-color); }

        .modal-text {
            font-size: 16px;
            color: #5a6c7d;
            margin-bottom: 25px;
            font-weight: 500;
            line-height: 1.5;
        }

        .modal-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(44, 62, 80, 0.2);
            width: 100%;
        }

        .restart-btn {
            background-color: var(--accent-color);
            color: var(--primary-color);
            border: none;
            padding: 14px 30px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 25px;
            font-weight: 700;
            width: 100%;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2);
        }
    </style>
</head>
<body>

    <div id="quiz-box">
        <h1>أسئلة في العقيدة الإسلامية</h1>
        
        <div id="question-container">
            <span id="question">جاري تحميل السؤال...</span>
        </div>

        <div id="options-container"></div>

        <div id="progress">الأسئلة المتبقية: -- من أصل --</div>
    </div>

    <div id="feedback-modal" class="modal-overlay">
        <div class="modal-content">
            <div id="modal-title" class="modal-title"></div>
            <div id="modal-text" class="modal-text"></div>
            <button id="modal-next-btn" class="modal-btn" onclick="closeModalAndContinue()">التالي</button>
        </div>
    </div>

    <script>
        const quizData = [
            { question: "ما هو أصل الأصول ولب دعوة المرسلين؟", options: ["توحيد الله العبادة", "الإيمان بالملائكة", "معرفة السيرة النبوية"], answer: 0 },
            { question: "منكر القدر يعتبر في العقيدة الإسلامية لغة وشرعاً:", options: ["كافر", "مؤمن", "مسلم"], answer: 0 },
            { question: "ما معنى الإيمان بالملائكة؟", options: ["التصديق الجازم بوجودهم وأنهم عباد مكرمون", "رؤيتهم بالعين المجردة", "عبادتهم من دون الله"], answer: 0 },
            { question: "المراد بالتوحيد في الإسلام هو:", options: ["إفراد الله بالربوبية والألوهية والأسماء والصفات", "الإيمان بوجود الله فقط", "القيام بالعبادات الظاهرة فقط"], answer: 0 },
            { question: "ما حكم الإيمان بالكتب السماوية؟", options: ["واجب وهو ركن من أركان الإيمان", "مستحب", "جائز"], answer: 0 },
            { question: "أول الرسل هو نوح عليه السلام وآخرهم هو:", options: ["محمد صلى الله عليه وسلم", "عيسى عليه السلام", "موسى عليه السلام"], answer: 0 },
            { question: "ما معنى الإيمان باليوم الآخر؟", options: ["التصديق بكل ما أخبر به النبي مما يكون بعد الموت", "الخوف من الموت فقط", "معرفة علامات الساعة فقط"], answer: 0 },
            { question: "توحيد الربوبية يعني:", options: ["إفراد الله بأفعاله كالخلق والرزق والتدبير", "صرف العبادة لله وحده", "إثبات الأسماء والصفات لله"], answer: 0 },
            { question: "توحيد الألوهية يعني:", options: ["إفراد الله بجميع أنواع العبادة", "الإيمان بأن الله هو الخالق فقط", "تعظيم الأنبياء والصالحين"], answer: 0 },
            { question: "الشرك الأكبر يوجب:", options: ["الخلود في النار وحبوط جميع الأعمال", "عقوبة مؤقتة في النار", "نقصان الإيمان فقط"], answer: 0 },
            { question: "من أمثلة الشرك الأصغر:", options: ["الرياء اليسير والحلف بغير الله دون تعظيم كتعظيم الله", "دعاء غير الله", "الذبح لغير الله"], answer: 0 },
            { question: "النفاق الاعتقادي (الأكبر) يخرج صاحبه من الإسلام ويجعله في:", options: ["الدرك الأسفل من النار", "الجنة بعد الحساب", "منزلة بين المنزلتين"], answer: 0 },
            { question: "ما هو حكم السحر في الإسلام؟", options: ["كفر مخرج من الملة", "معصية صغيرة", "مباح للضرورة"], answer: 0 },
            { question: "الإيمان يزيد وينقص؛ يزيد بـ:", options: ["الطاعة وينقص بالمعصية", "القراءة وينقص بالكتابة", "المال وينقص بالفقر"], answer: 0 },
            { question: "الاستغاثة بغير الله فيما لا يقدر عليه إلا الله تعتبر:", options: ["شرك أكبر", "بدعة مستحبة", "جائزة شرعاً"], answer: 0 },
            { question: "ما هو التعريف الشرعي للإيمان؟", options: ["قول باللسان واعتقاد بالجنان وعمل بالأركان", "المعرفة بالقلب فقط", "النطق بالشهادتين فقط"], answer: 0 },
            { question: "أركان الإيمان عددها:", options: ["ستة أركان", "خمسة أركان", "سبعة أركان"], answer: 0 },
            { question: "أركان الإسلام عددها:", options: ["خمسة أركان", "ستة أركان", "أربعة أركان"], answer: 0 },
            { question: "أعلى مراتب الدين الثلاثة هي:", options: ["الإحسان", "الإيمان", "الإسلام"], answer: 0 },
            { question: "تعريف الإحسان هو أن:", options: ["تعبد الله كأنك تراه، فإن لم تكن تراه فإنه يراك", "تصلي النوافل دائماً", "تتصدق بكل مالك"], answer: 0 },
            { question: "الكتب التي يجب الإيمان بها هي:", options: ["كل ما أنزله الله على رسله كالتوراة والإنجيل والزبور والقرآن", "القرآن الكريم فقط", "التوراة والإنجيل الحالية"], answer: 0 },
            { question: "أفضل الأنبياء والرسل وأول العزم هو:", options: ["نبينا محمد صلى الله عليه وسلم", "إبراهيم عليه السلام", "موسى عليه السلام"], answer: 0 },
            { question: "الإيمان بالقدر خيره وشره يعني:", options: ["التصديق بأن كل ما يحدث في الكون بعلم الله ومشيئته وخلقه", "ترك العمل والاتكال", "أن الإنسان مجبر على أفعاله تماماً"], answer: 0 },
            { question: "القرآن الكريم هو كلام الله:", options: ["منزل غير مخلوق، منه بدأ وإليه يعود", "مخلوق أوحى الله بمعناه", "حكاية عن كلام الله"], answer: 0 },
            { question: "رؤية المؤمنين لربهم في الجنة يوم القيامة هي:", options: ["حق ثابتة بالكتاب والسنة", "مستحيلة عقلاً", "رؤية مجازية بالقلب فقط"], answer: 0 },
            { question: "من مات على الكفر والشرك الأكبر فإنه:", options: ["لا يغفر له أبداً وهو خالد في النار", "تحت المشيئة إن شاء الله غفر له", "يدخل الجنة بعد التطهير"], answer: 0 },
            { question: "حكم سب الله أو رسوله أو دينه يعتبر:", options: ["كفر مخرج من الملة بإجماع العلماء", "معصية كبرى لا تخرج من الملة", "جهل يعذر صاحبه مطلقاً"], answer: 0 },
            { question: "الواجب تجاه أصحاب رسول الله صلى الله عليه وسلم هو:", options: ["محبتهم والترضي عنهم والدفاع عنهم وكف الإمساك عما شجر بينهم", "الغلو في بعضهم وتكفير بعضهم", "اعتبارهم كبقية الناس دون ميزة"], answer: 0 },
            { question: "كرامات الأولياء هي أمور خارقة للعادة تظهر على يد:", options: ["مؤمن تقي متبع للشرع", "ساحر مستعين بالجن", "كل من يدعي الولاية"], answer: 0 },
            { question: "البدعة في الدين هي:", options: ["كل محدثة في الدين ليس لها أصل في الشرع", "كل اختراع دنيوي جديد كالسيارة", "الاجتهاد في المسائل الفقهية المعاصرة"], answer: 0 },
            { question: "الشفاعة العظمى يوم القيامة لإراحة الناس من الموقف هي خاصة بـ:", options: ["النبي محمد صلى الله عليه وسلم وحده", "جميع الأنبياء", "الملائكة المقربين"], answer: 0 },
            { question: "حكم طاعة ولاة أمر المسلمين في غير معصية الله هو:", options: ["واجبة شرعاً جمعاً للكلمة ومنعاً للفتنة", "مستحبة فقط", "محرمة مطلقاً"], answer: 0 },
            { question: "عذاب القبر ونعيمه للميت في برزخه هو:", options: ["حق ثابت يجب الإيمان به", "أمر خيالي لا حقيقة له", "خاص بالكفار فقط"], answer: 0 },
            { question: "الميزان يوم القيامة توزن فيه:", options: ["الأعمال والصحائف والعامل نفسه", "النيات فقط", "أحجام الأجسام فقط"], answer: 0 },
            { question: "الصراط هو جسر ممدود على متن:", options: ["جهنم يمر الناس عليه على قدر أعمالهم", "الجنة يدخله الصالحون مباشرة", "البحر يعبره الشهداء"], answer: 0 },
            { question: "الحوض المورود لنبينا صلى الله عليه وسلم ماؤه أشد بياضاً من:", options: ["اللبن وأحلى من العسل ومن شرب منه لا يظمأ أبداً", "الماء الصافي وأبرد من الثلج", "المطر وله رائحة المسك"], answer: 0 },
            { question: "الجنة والنار مخلوقتان الآن و:", options: ["لا تفنيان أبداً ولا تبيدان", "تفنيان بعد دخول أهل الجنة الجنة", "تخلقان يوم القيامة فقط"], answer: 0 },
            { question: "الذنب الذي لا يغفره الله لمن مات عليه هو:", options: ["الشرك بالله", "القتل العمد", "الزنا الكبائر"], answer: 0 },
            { question: "المراد بـ 'العقيدة الإسلامية' هي الأمور التي يجب أن:", options: ["يصدق بها القلب وتطمئن إليها النفس وتكون يقيناً لا شك فيه", "تدرس في المدارس فقط", "تطبق بالبدن دون القلوب"], answer: 0 },
            { question: "مصدر العقيدة الإسلامية الصحيحة هو:", options: ["الكتاب والسنة بفهم سلف الأمة", "عقول الفلاسفة والمفكرين", "العادات والتقاليد والمجربات"], answer: 0 },
            { question: "أول واجب على المكلف هو:", options: ["شهادة أن لا إله إلا الله وأن محمداً رسول الله", "الصلاة والصيام", "طلب العلم الدنيوي"], answer: 0 },
            { question: "معنى شهادة 'لا إله إلا الله' أي:", options: ["لا معبود بحق إلا الله", "لا خالق إلا الله", "لا موجود إلا الله"], answer: 0 },
            { question: "تتضمن شهادة لا إله إلا الله ركنين هما:", options: ["النفي (لا إله) والإثبات (إلا الله)", "القول والعمل", "الخوف والرجاء"], answer: 0 },
            { question: "معنى شهادة 'أن محمداً رسول الله' طاعته فيما أمر وتصديقه فيما أخبر و:", options: ["اجتناب ما نهى عنه وألا يعبد الله إلا بما شرع", "تعظيمه لدرجة رفعه فوق البشرية", "الصلاة عليه يوم الجمعة فقط"], answer: 0 },
            { question: "العبادة هي اسم جامع لكل ما يحبه الله ويرضاه من:", options: ["الأقوال والأعمال الظاهرة والباطنة", "الصلوات والصدقات فقط", "الأفكار والنوايا القلبية فقط"], answer: 0 },
            { question: "شرطا قبول العبادة عند الله هما:", options: ["إخلاص لله والمتابعة للرسول صلى الله عليه وسلم", "النية الصادقة والجهد الكبير", "حضور القلب وكثرة البكاء"], answer: 0 },
            { question: "المراد بالجاهلية هي الحالة التي كان عليها الناس قبل الإسلام من:", options: ["الجهل بالله ورسله وشرائع الدين والافتخار بالأنساب", "عدم القراءة والكتابة فقط", "الفقر وضيق العيش"], answer: 0 },
            { question: "الولاية الشرعية في الإسلام تنال بـ:", options: ["الإيمان والتقوى والاتباع", "الوراثة والنسب والشرف", "الاعتزال وكثرة الرياضات النفسية"], answer: 0 },
            { question: "حكم دعاء الأموات أو الغائبين والاستغاثة بهم لطلب المدد:", options: ["شرك أكبر مخرج من الملة", "توسل مشروع ومستحب", "مكروه كراهة تنزيهية"], answer: 0 },
            { question: "الذبح لغير الله تقرباً كالعزف للجن أو القبور حكمه:", options: ["شرك أكبر لعن الله فاعله", "معصية لا تصل للكفر", "جائز إذا كان القصد طيباً"], answer: 0 },
            { question: "الطواف بمشروع بقصد التعبد لا يجوز في الأرض إلا حول:", options: ["الكعبة المشرفة فقط", "قبور الأنبياء والصالحين", "بيت المقدس ومسجد المدينة"], answer: 0 },
            { question: "حكم التوسل بذات الأنبياء أو جاههم في الدعاء عند جمهور السلف:", options: ["بدعة ومحرم ووسيلة للشرك", "شرك أكبر مخرج من الدين", "جائز ومستحب مطلقاً"], answer: 0 },
            { question: "التمائم هي ما يعلق على الأولاد أو البيوت لدفع العين وحكمها:", options: ["محرمة ومن الشرك الأصغر وقد تكون أكبر حسب اعتقاد معلقها", "مباحة إذا كانت من الخرز الأزرق", "مستحبة لحفظ النفس والأموال"], answer: 0 },
            { question: "من ادعى علم الغيب بالمستقبل عن طريق النجوم أو الفنجان حكمه:", options: ["كافر لأنه شارك الله في خصائصه", "مخطئ ومسلي فقط", "ذكي وموهوب علمياً"], answer: 0 },
            { question: "الذهاب إلى الكهان والعرافين وتصديقهم بما يقولون حكمه:", options: ["كفر بما أنزل على محمد صلى الله عليه وسلم", "مكروه ولا تقبل له صلاة أربعين ليلة دون كفر", "جائز للاستكشاف فقط"], answer: 0 },
            { question: "التطير هو التشاؤم بالطيور أو الأسماء أو الأرقام وحكمه في الإسلام:", options: ["شرك أصغر ينافي كمال التوحيد الواجب", "طبيعة بشرية لا إثم فيها", "مباح وواقع مجرب"], answer: 0 },
            { question: "الحكم بغير ما أنزل الله يكون كفراً أكبراً مخرجاً من الملة إذا:", options: ["اعتقد أن حكم غير الله أفضل أو مساوٍ أو استحل ذلك", "حكم بغيره لهوى أو رشوة مع اعترافه بالخطأ", "جهل الحكم الشرعي الصحيح"], answer: 0 },
            { question: "الردة هي الكفر بعد الإسلام وتكون بـ:", options: ["القول أو الفعل أو الاعتقاد أو الشك الناقض للدين", "ارتكاب المعاصي الكبيرة كالزنا", "السفر إلى بلاد غير المسلمين"], answer: 0 },
            { question: "أول ركن من أركان الإيمان الستة وهو أساسها جميعاً:", options: ["الإيمان بالله", "الإيمان بالملائكة", "الإيمان باليوم الآخر"], answer: 0 },
            { question: "أسماء الله وصفاته نثبتها لله من غير:", options: ["تحريف ولا تعطيل ومن غير تكييف ولا تمثيل", "تأويل عقلي مقبول فقط", "مقارنة بصفات المخلوقين مع إثبات الشبه"], answer: 0 },
            { question: "الملائكة مخلوقون من:", options: ["نور", "نار", "طين"], answer: 0 },
            { question: "الجن مخلوقون من:", options: ["مارج من نار", "نور خالص", "تراب الأرض"], answer: 0 },

            { question: "أخوف ما خاف النبي صلى الله عليه وسلم على أمته الشرك الأصغر وفسره بـ:", options: ["الرياء", "السرقة", "الكذب"], answer: 0 },
            { question: "القول بأن الإنسان مجبر على أفعاله تماماً ولا مشيئة له بالكلية هو قول طائفة:", options: ["الجبرية", "القدرية", "المعتزلة"], answer: 0 },
            { question: "القول بأن العبد يخلق فعل نفسه وأن الله لم يقدر المعاصي هو قول طائفة:", options: ["القدرية", "الجبرية", "الأشاعرة"], answer: 0 },
            { question: "السنة في لغة العقيدة تعني:", options: ["طريقة النبي صلى الله عليه وسلم وصحابته في الاعتقاد والعمل", "النافلة التي يثاب فاعلها ولا يعاقب تاركها", "الحديث النبوي الشريف فقط"], answer: 0 },
            { question: "الجماعة هم الذين اجتمعوا على الحق والاتباع وهم:", options: ["الصحابة والتابعون ومن سار على نهجهم إلى يوم الدين", "أكثر الناس عدداً في العالم", "الحركات والأحزاب المعاصرة"], answer: 0 },
            { question: "الواجب عند حدوث الفتن والنزاعات بين المسلمين هو الالتزام بـ:", options: ["الكتاب والسنة ولزوم جماعة المسلمين وإمامهم", "الاعتزال السلبي التام دون تمييز للحق", "التحيز للجهة الأكثر قوة ومالاً"], answer: 0 },

            { question: "نعيم أهل الجنة في الجنة وبقاؤهم فيها يكون:", options: ["سرمدي أبدي لا ينقطع ولا ينتهي", "مؤقت لفترة زمنية طويلة جداً", "متجدد حسب الرغبة ثم يزول"], answer: 0 },

            { question: "النبي صلى الله عليه وسلم حمى حمى التوحيد فنهى عن الغلو في مدحه كقوله:", options: ["لا تطروني كما أطرت النصارى ابن مريم", "صلوا كما رأيتموني أصلي", "تركت فيكم ما إن تمسكتم به لن تضلوا"], answer: 0 },
            { question: "زيارة القبور تكون مشروعة وسنة إذا كان القصد منها:", options: ["الاعتبار وتذكر الآخرة والدعاء للأموات المسلمين", "طلب الحاجات وتفريج الكربات من الميت", "التبرك بتراب القبر وبناء المساجد عليها"], answer: 0 },
            { question: "الذين لا خوف عليهم ولا هم يحزنون هم أولياء الله وتفسيرهم الشرعي:", options: ["الذين آمنوا وكانوا يتقون", "الذين يملكون خوارق عادات دنيوية", "الذين اعتزلوا الناس تماماً وتفرغوا للتصوف"], answer: 0 },
            { question: "الإيمان بجميع الأنبياء شرط لصحة الإيمان فمن كفر بنبي واحد فقد:", options: ["كفر بجميع الأنبياء وخرج من الملة", "نقص إيمانه الواجب فقط", "وقع في معصية كبرى دون كفر"], answer: 0 },
            { question: "الركن السادس والأخير من أركان الإيمان الستة المعتمدة هو:", options: ["الإيمان بالقدر خيره وشره", "الإيمان باليوم الآخر", "الإيمان بالرسل والأنبياء"], answer: 0 },
            { question: "الشهادة التي تعصم دم الإنسان وماله في الدنيا هي قول:", options: ["أشهد أن لا إله إلا الله وأشهد أن محمداً رسول الله", "أشهد أن الجنة حق والنار حق", "أستغفر الله العظيم وأتوب إليه"], answer: 0 }
        ];

        const correctPhrases = [
            "أحسنت، بارك الله فيك وعليك!", "مبدع ومتألق دائماً!", "إجابة سديدة، وفقك الله!", 
            "ممتاز، زادك الله علماً وفهماً!", "أصبت الهدف بجدارة!", "رائع، ذكاء حاد وفهم ثاقب!", 
            "درجة كاملة في الوعي، بوركت!", "إجابة نموذجية، أحسنت صنعاً!", "صحيح، فتح الله عليك فتوح العارفين!", 
            "خطوة ممتازة نحو الصدارة!", "عبقري، إجابتك تثلج الصدر!", "ما شاء الله، إجابة متقنة وموفقة!"
        ];

        const wrongPhrases = [
            "ركز في المرة القادمة، فالقادم أفضل!", "للأسف، إجابة غير دقيقة.. حاول مجدداً!", "بسيطة، تعوضها في السؤال التالي بإذن الله!", 
            "تأمل في السؤال جيداً قبل الاختيار!", "لم يحالفك الحظ هذه المرة, ركز أكثر!", "خطأ بسيط، استعن بالله وتابع!", 
            "لا بأس، من الخطأ نتعلم الصواب!", "فكر ملياً، أنت قادر على حلها!", "انتبه للتفاصيل في الأسئلة القادمة!", 
            "معليش، خذ نفساً عميقاً وركز في القادم!"
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let audioCtx = null;

        function playSound(isCorrect) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (isCorrect) {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220.00, audioCtx.currentTime); 
                    osc.frequency.setValueAtTime(146.83, audioCtx.currentTime + 0.15); 
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                }
            } catch (e) {
                console.log("Audio logic blocked or un-supported: ", e);
            }
        }

        function initQuiz() {
            const savedIndex = localStorage.getItem('aqeedah_quiz_index');
            const savedScore = localStorage.getItem('aqeedah_quiz_score');

            if (savedIndex !== null) {
                currentQuestionIndex = parseInt(savedIndex, 10);
            }
            if (savedScore !== null) {
                score = parseInt(savedScore, 10);
            }

            loadQuestion();
        }

        function loadQuestion() {
            const questionElement = document.getElementById('question');
            const optionsContainer = document.getElementById('options-container');
            const progressElement = document.getElementById('progress');

            if (!questionElement || !optionsContainer) {
                setTimeout(loadQuestion, 50);
                return;
            }

            optionsContainer.innerHTML = '';

            if (currentQuestionIndex < quizData.length) {
                const currentQuiz = quizData[currentQuestionIndex];
                questionElement.innerText = currentQuiz.question;

                if (progressElement) {
                    const remaining = quizData.length - currentQuestionIndex;
                    progressElement.innerText = `الأسئلة المتبقية: ${remaining} من أصل ${quizData.length}`;
                }

                currentQuiz.options.forEach((option, index) => {
                    const button = document.createElement('button');
                    button.innerText = option;
                    button.className = 'option-btn';
                    button.onclick = () => checkAnswer(button, index);
                    optionsContainer.appendChild(button);
                });
            } else {
                showResults();
            }
        }

        function checkAnswer(clickedButton, selectedIndex) {
            const currentQuiz = quizData[currentQuestionIndex];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach(btn => btn.disabled = true);

            let isCorrect = (selectedIndex === currentQuiz.answer);

            if (isCorrect) {
                clickedButton.classList.add('correct');
                score++;
                playSound(true);
                showFeedbackPopup(true);
            } else {
                clickedButton.classList.add('wrong');
                buttons[currentQuiz.answer].classList.add('correct');
                playSound(false);
                showFeedbackPopup(false);
            }
        }

        function showFeedbackPopup(isCorrect) {
            const modal = document.getElementById('feedback-modal');
            const title = document.getElementById('modal-title');
            const text = document.getElementById('modal-text');

            if (isCorrect) {
                title.innerText = "إجابة صحيحة! 🎉";
                title.className = "modal-title success";
                const randomPhrase = correctPhrases[Math.floor(Math.random() * correctPhrases.length)];
                text.innerText = randomPhrase;
            } else {
                title.innerText = "إجابة خاطئة 💔";
                title.className = "modal-title fail";
                const randomPhrase = wrongPhrases[Math.floor(Math.random() * wrongPhrases.length)];
                text.innerText = randomPhrase;
            }

            modal.classList.add('active');
        }

        // التعديل الجوهري: يتم تخزين التقدم الفعلي هنا فقط لضمان سلامة البيانات من أي تنشيط مفاجئ للشاشة
        function closeModalAndContinue() {
            const modal = document.getElementById('feedback-modal');
            modal.classList.remove('active');
            
            currentQuestionIndex++;
            
            localStorage.setItem('aqeedah_quiz_index', currentQuestionIndex);
            localStorage.setItem('aqeedah_quiz_score', score);
            
            loadQuestion();
        }

        function showResults() {
            const quizBox = document.getElementById('quiz-box');
            if (quizBox) {
                quizBox.innerHTML = `
                    <div style="padding: 10px; text-align: center;">
                        <h2 style="color: var(--primary-color); font-weight:700;">الحمد لله، تم إكمال الاختبار بنجاح</h2>
                        <p style="font-size: 20px; margin: 25px 0; color: #5a6c7d;">درجتك النهائية الفخمة هي:<br><strong style="font-size:32px; color:var(--accent-color); font-weight:800;">${score}</strong> من أصل <strong style="font-size:24px;">${quizData.length}</strong></p>
                        <button onclick="restartQuizFromScratch()" class="restart-btn">إعادة الاختبار الملكي</button>
                    </div>
                `;
            }
        }

        function restartQuizFromScratch() {
            localStorage.removeItem('aqeedah_quiz_index');
            localStorage.removeItem('aqeedah_quiz_score');
            currentQuestionIndex = 0;
            score = 0;
            
            const quizBox = document.getElementById('quiz-box');
            if (quizBox) {
                quizBox.innerHTML = `
                    <h1>أسئلة في العقيدة الإسلامية</h1>
                    <div id="question-container">
                        <span id="question">جاري تحميل السؤال...</span>
                    </div>
                    <div id="options-container"></div>
                    <div id="progress">الأسئلة المتبقية: -- من أصل --</div>
                `;
            }
            loadQuestion();
        }

        document.addEventListener('DOMContentLoaded', initQuiz);
        window.onload = initQuiz;
    </script>

</html>
