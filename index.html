<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqeedah Quiz - اختبار العقيدة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        #quiz-box {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 25px;
        }

        #question-container {
            background-color: #7f8fa6;
            color: white;
            padding: 20px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 25px;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background-color: #ffffff;
            color: #2c3e50;
            border: 2px solid #f0f3f2;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: right;
            font-weight: 500;
            width: 100%;
            box-sizing: border-box;
        }

        .option-btn:hover {
            background-color: #f1f2f6;
            border-color: #7f8fa6;
        }

        #progress {
            margin-top: 25px;
            color: #7f8c8d;
            font-size: 14px;
        }

        .restart-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="quiz-box">
        <h1>أسئلة في العقيدة الإسلامية</h1>
        
        <div id="question-container">
            <span id="question">جاري تحميل السؤال...</span>
        </div>

        <div id="options-container"></div>

        <div id="progress">الأسئلة المتبقية: -- من أصل --</div>
    </div>

            { question: "الجماعة هم الذين اجتمعوا على الحق والاتباع وهم:", options: ["الصحابة والتابعون ومن سار على نهجهم إلى يوم الدين", "أكثر الناس عدداً في العالم", "الحركات والأحزاب المعاصرة"], answer: 0 },

            { question: "عياذاً بالله، الكفر والشرك والردة يحبطون العمل لقوله تعالى:", options: ["لئن أشركت ليحبطن عملك ولتكونن من الخاسرين", "إن الحسنات يذهبن السيئات", "فمن يعمل مثقال ذرة خيراً يره"], answer: 0 },
            { question: "المراد بالتوحيد العلمي الخبري هو توحيد:", options: ["الأسماء والصفات والربوبية", "الألوهية والعبادة", "الحاكمية والتشريع فقط"], answer: 0 },
            { question: "المراد بالتوحيد الطلبي القصد هو توحيد:", options: ["الألوهية والعبادة وإفراد الله بالقصد والنية", "الربوبية والخلق", "الأسماء والصفات العليا"], answer: 0 },

            { question: "الإيمان بجميع الأنبياء شرط لصحة الإيمان فمن كفر بنبي واحد فقد:", options: ["كفر بجميع الأنبياء وخرج من الملة", "نقص إيمانه الواجب فقط", "وقع في معصية كبرى دون كفر"], answer: 0 },
            { question: "الركن السادس والأخير من أركان الإيمان الستة المعتمدة هو:", options: ["الإيمان بالقدر خيره وشره", "الإيمان باليوم الآخر", "الإيمان بالرسل والأنبياء"], answer: 0 },
            { question: "الشهادة التي تعصم دم الإنسان وماله في الدنيا هي قول:", options: ["أشهد أن لا إله إلا الله وأشهد أن محمداً رسول الله", "أشهد أن الجنة حق والنار حق", "أستغفر الله العظيم وأتوب إليه"], answer: 0 ]
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        // تشغيل مباشر وفوري بمجرد قراءة السكريبت دون انتظار onload لضمان بيئة WebView
        function loadQuestion() {
            const questionElement = document.getElementById('question');
            const optionsContainer = document.getElementById('options-container');
            const progressElement = document.getElementById('progress');

            if (optionsContainer) optionsContainer.innerHTML = '';

            if (currentQuestionIndex < quizData.length) {
                const currentQuiz = quizData[currentQuestionIndex];

                if (questionElement) questionElement.innerText = currentQuiz.question;

                if (progressElement) {
                    const remaining = quizData.length - currentQuestionIndex;
                    progressElement.innerText = `الأسئلة المتبقية: ${remaining} من أصل ${quizData.length}`;
                }

                currentQuiz.options.forEach((option, index) => {
                    const button = document.createElement('button');
                    button.innerText = option;
                    button.className = 'option-btn';
                    button.onclick = () => checkAnswer(index);
                    if (optionsContainer) optionsContainer.appendChild(button);
                });
            } else {
                showResults();
            }
        }

        function checkAnswer(selectedIndex) {
            const currentQuiz = quizData[currentQuestionIndex];
            if (selectedIndex === currentQuiz.answer) {
                score++;
            }
            currentQuestionIndex++;
            loadQuestion();
        }

        function showResults() {
            const quizBox = document.getElementById('quiz-box');
            if (quizBox) {
                quizBox.innerHTML = `
                    <div style="padding: 10px; text-align: center;">
                        <h2>الحمد لله، تم إكمال الاختبار بنجاح</h2>
                        <p style="font-size: 20px; margin: 20px 0;">درجتك النهائية هي: <strong>${score}</strong> من أصل <strong>${quizData.length}</strong></p>
                        <button onclick="restartQuizFromScratch()" class="restart-btn">إعادة الاختبار من جديد</button>
                    </div>
                `;
            }
        }

        function restartQuizFromScratch() {
            currentQuestionIndex = 0;
            score = 0;
            window.location.reload();
        }

        // استدعاء فوري وبدون شروط
        loadQuestion();
    </script>
