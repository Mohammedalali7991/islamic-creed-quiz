<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqeedah Quiz - اختبار العقيدة</title>
    <style>
        /* التنسيقات العامة للواجهة لتبدو متناسقة ومريحة على الهاتف */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        #quiz-box {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 25px;
        }

        #question-container {
            background-color: #7f8fa6;
            color: white;
            padding: 20px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 25px;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background-color: #ffffff;
            color: #2c3e50;
            border: 2px solid #f0f3f2;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: right;
            font-weight: 500;
        }

        .option-btn:hover {
            background-color: #f1f2f6;
            border-color: #7f8fa6;
        }

        #progress {
            margin-top: 25px;
            color: #7f8c8d;
            font-size: 14px;
        }

        .restart-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="quiz-box">
        <h1>أسئلة في العقيدة الإسلامية</h1>
        
        <div id="question-container">
            <span id="question">جاري تحميل السؤال...</span>
        </div>

        <div id="options-container"></div>

        <div id="progress">الأسئلة المتبقية: -- من أصل --</div>
    </div>

    <script>
        // 1. مصفوفة الأسئلة والأجوبة (أضف أسئلتك الكاملة هنا بنفس الترتيب والهيكل)
        const quizData = [
            {
                question: "ما هو أصل الأصول ولب دعوة المرسلين؟",
                options: ["توحيد الله العبادة", "الإيمان بالملائكة", "معرفة السيرة النبوية"],
                answer: 0
            },
            {
                question: "منكر القدر يعتبر في العقيدة الإسلامية لغة وشرعاً:",
                options: ["كافر", "مؤمن", "مسلم"],
                answer: 0
            }
            // يمكنك الاستمرار في دمج بقية الأسئلة الـ 100 هنا...
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        // 2. تشغيل النظام وفحص الذاكرة عند فتح التطبيق مباشرة
        window.onload = function() {
            initQuiz();
        };

        function initQuiz() {
            const savedIndex = localStorage.getItem('aqeedah_quiz_index');
            const savedScore = localStorage.getItem('aqeedah_quiz_score');

            // فحص وجود تقدم محفوظ والتحقق الآمن من الأرقام
            if (savedIndex !== null && parseInt(savedIndex) > 0) {
                const targetIndex = parseInt(savedIndex);
                const targetScore = savedScore !== null ? parseInt(savedScore) : 0;

                if (targetIndex < quizData.length) {
                    // إظهار رسالة التأكيد للمستخدم وتخييره بشكل صريح
                    const confirmResume = confirm(
                        "لقد توقفت سابقاً عند السؤال رقم (" + (targetIndex + 1) + ").\n\n" +
                        "هل تريد الإكمال من حيث توقفت؟\n" +
                        "[موافق: للإكمال | إلغاء: للبدء من جديد]"
                    );

                    if (confirmResume) {
                        currentQuestionIndex = targetIndex;
                        score = targetScore;
                    } else {
                        resetQuizStorage();
                    }
                } else {
                    resetQuizStorage();
                }
            } else {
                resetQuizStorage();
            }

            // عرض السؤال الحالي بعد استقرار الحالة
            loadQuestion();
        }

        // 3. دالة بناء وعرض السؤال على الشاشة
        function loadQuestion() {
            const questionElement = document.getElementById('question');
            const optionsContainer = document.getElementById('options-container');
            const progressElement = document.getElementById('progress');

            if (optionsContainer) optionsContainer.innerHTML = '';

            if (currentQuestionIndex < quizData.length) {
                const currentQuiz = quizData[currentQuestionIndex];

                if (questionElement) questionElement.innerText = currentQuiz.question;

                // تحديث العداد السفلي بدقة
                if (progressElement) {
                    const remaining = quizData.length - currentQuestionIndex;
                    progressElement.innerText = `الأسئلة المتبقية: ${remaining} من أصل ${quizData.length}`;
                }

                // حقن أزرار الإجابات بشكل ديناميكي آمن
                currentQuiz.options.forEach((option, index) => {
                    const button = document.createElement('button');
                    button.innerText = option;
                    button.className = 'option-btn';
                    button.onclick = () => checkAnswer(index);
                    if (optionsContainer) optionsContainer.appendChild(button);
                });

                // ⭐ [تأمين وحفظ تلقائي]: تخزين الموقع والدرجة لمنع الضياع عند عمل Refresh
                localStorage.setItem('aqeedah_quiz_index', currentQuestionIndex);
                localStorage.setItem('aqeedah_quiz_score', score);

            } else {
                showResults();
            }
        }

        // 4. دالة فحص الإجابة المختارة والانتقال فوراً
        function checkAnswer(selectedIndex) {
            const currentQuiz = quizData[currentQuestionIndex];

            if (selectedIndex === currentQuiz.answer) {
                score++;
            }

            currentQuestionIndex++;
            loadQuestion();
        }

        // 5. دالة إنهاء الاختبار وعرض النتيجة الإجمالية وتصفير الذاكرة بشكل قطعي
        function showResults() {
            const quizBox = document.getElementById('quiz-box');
            clearQuizStorage();

            if (quizBox) {
                quizBox.innerHTML = `
                    <div style="padding: 10px;">
                        <h2>الحمد لله، تم إكمال الاختبار بنجاح</h2>
                        <p style="font-size: 20px; margin: 20px 0;">درجتك النهائية هي: <strong>${score}</strong> من أصل <strong>${quizData.length}</strong></p>
                        <button onclick="restartQuizFromScratch()" class="restart-btn">إعادة الاختبار من جديد</button>
                    </div>
                `;
            }
        }

        // دوال المساعدة للتحكم النظيف بذاكرة الهاتف
        function resetQuizStorage() {
            currentQuestionIndex = 0;
            score = 0;
            localStorage.setItem('aqeedah_quiz_index', 0);
            localStorage.setItem('aqeedah_quiz_score', 0);
        }

        function clearQuizStorage() {
            localStorage.removeItem('aqeedah_quiz_index');
            localStorage.removeItem('aqeedah_quiz_score');
        }

        function restartQuizFromScratch() {
            clearQuizStorage();
            window.location.reload();
        }
    </script>
</body>
</html>
