<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>أسئلة في العقيدة الإسلامية</title>
    <style>
        :root {
            --primary-color: #4a6fa5;
            --success-color: #2ec4b6;
            --danger-color: #e71d36;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #2b2d42;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .app-title {
            text-align: center;
            color: #4a6fa5;
            margin-bottom: 20px;
            font-size: 1.6rem;
            font-weight: bold;
        }

        .quiz-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 25px;
        }

        .question-box {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            border-radius: 15px;
            padding: 25px 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 25px;
            position: relative;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 15px 20px;
            text-align: right;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            width: 100%;
            color: var(--text-color);
        }

        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: var(--success-color) !important;
            color: #155724 !important;
        }

        .option-btn.wrong {
            background-color: #f8d7da !important;
            border-color: var(--danger-color) !important;
            color: #721c24 !important;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            width: 85%;
            max-width: 400px;
            text-align: center;
        }

        .modal-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        .modal-text {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .modal-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
        }

        .progress-bar {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #777;
            text-align: center;
        }
    </style>
</head>

        <div class="options-list">

            <button class="option-btn" onclick="checkAnswer(1)"></button>

        <div class="progress-bar" id="progress-text">جاري الحساب...</div>

        // ميزة توليد الأصوات برمجياً بدون ملفات صوتية خارجية لشغل الهاتف
        function playTone(type) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if (type === 'correct') {
                    // نغمة نجاح سريعة ومرتفعة
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1); // A5
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);
                } else if (type === 'wrong') {
                    // نغمة خطأ منخفضة ومنبهة
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, ctx.currentTime); // A3
                    osc.frequency.setValueAtTime(146.83, ctx.currentTime + 0.15); // D3
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.35);
                } else if (type === 'victory') {
                    // نغمة فوز واحتفال عند النهاية الكبرى
                    osc.type = 'triangle';
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + (idx * 0.1));
                    });
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.5);
                }
            } catch (e) {
                console.log("Audio Context not supported yet.");
            }
        }

        function loadQuestion() {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.className = "option-btn";
                btn.style.display = 'block';
                btn.disabled = false;
            });

            let currentQuestion;

            // التحقق من قائمة الإعادة الذكية أولاً
            if (reviewQueue.length > 0 && reviewQueue[0].targetCount === globalQuestionCounter) {
                currentQuestion = reviewQueue.shift().questionData;
            } else if (currentQuestionIndex < allQuestionsData.length) {
                currentQuestion = allQuestionsData[currentQuestionIndex];
                currentQuestionIndex++;
            } else if (reviewQueue.length > 0) {
                currentQuestion = reviewQueue.shift().questionData;
            } else {
                // إتمام جميع الأسئلة بالكامل والوصول لشاشة النهاية
                isQuizFinished = true;
                playTone('victory');
                document.getElementById('question-text').innerText = "🎉 تهانينا الكبرى! لقد أتممت جميع الـ 100 سؤال في العقيدة الإسلامية بنجاح وتفوق.";
                buttons.forEach(btn => btn.style.display = 'none');
                document.getElementById('progress-text').innerText = "اكتمل الاختبار كاملاً.";
                
                // تحويل زر المودال ليصبح زر إعادة التشغيل من جديد
                const actionBtn = document.getElementById('modal-action-btn');
                actionBtn.innerText = "البدء من جديد";
                actionBtn.setAttribute("onclick", "restartQuiz()");
                
                showModal(true, "لقد أكملت الرحلة بنجاح!");
                return;
            }

            document.getElementById('question-text').innerText = currentQuestion.q;
            correctAnswerText = currentQuestion.options[0]; // الخيار الأول دائماً هو الإجابة الصحيحة الأصلية

            // خلط الخيارات عشوائياً حتى لا يحفظ المستخدم مكان الإجابة
            let shuffledOptions = [...currentQuestion.options].sort(() => Math.random() - 0.5);
            buttons.forEach((btn, index) => {
                btn.innerText = shuffledOptions[index];
            });

            let totalRemaining = (allQuestionsData.length - currentQuestionIndex) + reviewQueue.length + 1;
            document.getElementById('progress-text').innerText = `الأسئلة المتبقية: ${totalRemaining} من أصل 100`;
        }

        function checkAnswer(buttonIndex) {
            const buttons = document.querySelectorAll('.option-btn');
            const selectedButton = buttons[buttonIndex];
            globalQuestionCounter++;

            let isCorrect = (selectedButton.innerText === correctAnswerText);

            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.innerText === correctAnswerText) {
                    btn.classList.add('correct');
                }
            });

            if (isCorrect) {
                playTone('correct');
                selectedButton.classList.add('correct');
            } else {
                playTone('wrong');
                selectedButton.classList.add('wrong');
                
                // حفظ السؤال لإعادة طرحه بعد 4 جولات
                let currentQuestionData = {
                    q: document.getElementById('question-text').innerText,
                    options: [correctAnswerText, ...Array.from(buttons).map(b => b.innerText).filter(t => t !== correctAnswerText)]
                };
                reviewQueue.push({
                    questionData: currentQuestionData,
                    targetCount: globalQuestionCounter + 4
                });
            }

            setTimeout(() => { showModal(isCorrect); }, 600);
        }

        function showModal(isCorrect, customMessage = null) {
            const modal = document.getElementById('modal');
            const modalIcon = document.getElementById('modal-icon');
            const modalMessage = document.getElementById('modal-message');

            if (customMessage) {
                modalIcon.innerText = "🏆";
                modalMessage.innerText = customMessage;
            } else if (isCorrect) {
                let randomPhrase = correctPhrases[Math.floor(Math.random() * correctPhrases.length)];
                modalIcon.innerText = randomPhrase.icon;
                modalMessage.innerText = randomPhrase.text;
            } else {
                let randomPhrase = wrongPhrases[Math.floor(Math.random() * wrongPhrases.length)];
                modalIcon.innerText = randomPhrase.icon;
                modalMessage.innerText = randomPhrase.text;
            }
            modal.classList.add('show');
        }

        function nextQuestion() {
            document.getElementById('modal').classList.remove('show');
            loadQuestion();
        }

        // ميزة العودة من جديد وتصفير كافة العدادات والأسئلة
        function restartQuiz() {
            document.getElementById('modal').classList.remove('show');
            reviewQueue = [];
            currentQuestionIndex = 0;
            globalQuestionCounter = 0;
            isQuizFinished = false;
            
            // إعادة تعيين زر المودال لوضعه الطبيعي
            const actionBtn = document.getElementById('modal-action-btn');
            actionBtn.innerText = "المتابعة";
            actionBtn.setAttribute("onclick", "nextQuestion()");
            
            loadQuestion();
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
